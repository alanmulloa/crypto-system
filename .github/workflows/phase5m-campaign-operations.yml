name: Phase 5M durable campaign operations

on:
  schedule:
    - cron: "7 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: phase5m-campaign-operations
  cancel-in-progress: false

jobs:
  durable-operations:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt
      - run: ruff check app tests
      - run: pytest -q

      - name: Build fresh campaign operations
        env:
          BINANCE_MARKET_BASE_URL: https://data-api.binance.vision
        run: |
          python -m app.evaluation.campaign_operations_cli \
            --campaign research/campaigns/core-mean-reversion-forward-2026-11.json \
            --registry research/experiment-registry.json \
            --reports-root reports/phase5k \
            --output reports/phase5m/fresh.json

      - name: Persist immutable campaign history
        run: |
          python -m app.evaluation.campaign_operations_persistence \
            --fresh-report reports/phase5m/fresh.json \
            --latest reports/phase5m/latest.json \
            --history-dir reports/phase5m/history

      - name: Detect campaign incidents
        run: |
          python -m app.evaluation.campaign_incidents_cli \
            --input reports/phase5m/latest.json \
            --output reports/phase5m/incidents.json

      - name: Commit durable operations evidence
        run: |
          rm -f reports/phase5m/fresh.json
          if git diff --quiet -- reports/phase5m; then
            echo "No durable campaign operations changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/phase5m
          git commit -m "Collect durable Phase 5M campaign operations"
          git push origin HEAD:main
