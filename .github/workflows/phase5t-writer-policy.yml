name: Phase 5T research writer policy audit

on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - "agent/app/evaluation/workflow_writer_policy.py"
      - "agent/tests/test_workflow_writer_policy.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt
      - run: ruff check app tests
      - run: pytest -q
      - run: |
          python -m app.evaluation.workflow_writer_policy_cli \
            --root .. \
            --output reports/phase5t/writer-policy.json

      - uses: actions/upload-artifact@v4
        with:
          name: phase5t-writer-policy
          path: agent/reports/phase5t/writer-policy.json
          if-no-files-found: error
          retention-days: 30
