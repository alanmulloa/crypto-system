name: Phase 5H generic prospective research

on:
  schedule:
    - cron: "41 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: phase5h-generic-prospective
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt
      - run: ruff check app tests
      - run: pytest -q

      - name: Plan research experiments
        run: |
          python -m app.evaluation.research_experiment_planner_cli \
            --registry research/experiment-registry.json \
            --output reports/research-plan.json

      - name: Collect generic prospective evidence
        env:
          BINANCE_MARKET_BASE_URL: https://data-api.binance.vision
        run: |
          python -m app.evaluation.generic_prospective_batch_cli \
            --registry research/experiment-registry.json \
            --reports-root reports/prospective \
            --summary-output reports/prospective/batch-summary.json

      - name: Commit generic research evidence
        run: |
          if git diff --quiet -- reports/prospective reports/research-plan.json; then
            echo "No generic prospective evidence changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/prospective reports/research-plan.json
          git commit -m "Collect generic Phase 5H prospective evidence"
          git push origin HEAD:main
