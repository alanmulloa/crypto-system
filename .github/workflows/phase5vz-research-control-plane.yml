name: Phase 5V-5Z research control plane

on:
  schedule:
    - cron: "11 8 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: research-main-writer
  cancel-in-progress: false

jobs:
  control-plane:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt
      - run: ruff check app tests
      - run: pytest -q

      - name: Rebuild current writer policy
        run: |
          python -m app.evaluation.workflow_writer_policy_cli \
            --root .. \
            --output reports/phase5t/writer-policy.json

      - name: Rebuild campaign governance when durable inputs exist
        run: |
          if test -f reports/phase5m/latest.json && test -f reports/phase5m/incidents.json; then
            mkdir -p reports/phase5nq
            python -m app.evaluation.campaign_recovery_cli \
              --incidents reports/phase5m/incidents.json \
              --output reports/phase5nq/recovery.json
            python -m app.evaluation.campaign_reproducibility_cli \
              --campaign research/campaigns/core-mean-reversion-forward-2026-11.json \
              --operations reports/phase5m/latest.json \
              --incidents reports/phase5m/incidents.json \
              --recovery reports/phase5nq/recovery.json \
              --output reports/phase5nq/reproducibility.json
            python -m app.evaluation.campaign_review_pack_cli \
              --operations reports/phase5m/latest.json \
              --incidents reports/phase5m/incidents.json \
              --recovery reports/phase5nq/recovery.json \
              --reproducibility reports/phase5nq/reproducibility.json \
              --output reports/phase5nq/review-pack.json
            python -m app.evaluation.campaign_governance_cli \
              --review-pack reports/phase5nq/review-pack.json \
              --reproducibility reports/phase5nq/reproducibility.json \
              --output reports/phase5nq/governance.json
          else
            echo "Phase 5M durable inputs not available yet."
          fi

      - name: Build unified research control plane
        run: |
          python -m app.evaluation.research_control_plane_cli \
            --registry research/experiment-registry.json \
            --phase5g-root reports/phase5g \
            --campaign-governance reports/phase5nq/governance.json \
            --writer-policy reports/phase5t/writer-policy.json \
            --phase5m-root reports/phase5m \
            --dependencies-output reports/phase5vz/dependencies.json \
            --previous reports/phase5vz/latest.json \
            --output reports/phase5vz/current.json \
            --diff-output reports/phase5vz/diff.json

      - name: Persist material control-plane state
        run: |
          python -m app.evaluation.research_control_plane_material_persistence \
            --current reports/phase5vz/current.json \
            --diff reports/phase5vz/diff.json \
            --latest reports/phase5vz/latest.json \
            --history-dir reports/phase5vz/history \
            --events-dir reports/phase5vz/events

      - name: Commit durable control-plane evidence
        run: |
          rm -f reports/phase5vz/current.json reports/phase5vz/diff.json reports/phase5vz/dependencies.json
          if git diff --quiet -- reports/phase5vz; then
            echo "No material control-plane change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/phase5vz
          git commit -m "Persist Phase 5AA-5AB control-plane state"
          git pull --rebase origin main
          git push origin HEAD:main

      - uses: actions/upload-artifact@v4
        with:
          name: phase5vz-research-control-plane
          path: agent/reports/phase5vz
          if-no-files-found: error
          retention-days: 30
